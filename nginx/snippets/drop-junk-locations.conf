# Scanner / exploit probes — close connection with no response body.
# Included from each tenant vhost (HTTP and HTTPS). Keep ACME locations
# declared before this include so /.well-known/ is not affected.

location ~* /(wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin) {
    return 444;
}

location ~* /(\.env|\.git) {
    return 444;
}

location ~* \.(php|asp|aspx|cgi|exe)$ {
    return 444;
}
